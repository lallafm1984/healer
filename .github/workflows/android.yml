# Android 시험용 APK (고정 디버그 키 서명 → 새 빌드를 덮어 설치해도 저장이 남음). main에 푸시되거나 Actions 탭에서 직접 실행하면 만들어지고,
# 실행 결과 페이지의 Artifacts에서 healer-debug-apk를 내려받아 폰에 설치한다.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: healer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
