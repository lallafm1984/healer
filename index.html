<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15120E">
<title>나혼자 힐러 (개발 빌드)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
</head>
<body>
<!-- 전체화면: 화면 맨 위부터 노치 포함 70dp = 배너 영역 (09 5장, Lim 2026-10-07) -->
<div id="adBanner" aria-label="배너 광고 자리"><span>배너 광고 자리 · 70dp</span></div>
<div id="viewport">
<div id="app">
  <!-- 새 화면(타이틀·로비·콘텐츠·입장·편성·정산·보상·설정)은 src/screens가 여기에 붙인다 -->
  <section id="rest" class="screen" hidden aria-label="휴식">
    <div class="gd-scroll" id="restBody">
      <header class="rest-head">
        <h1>휴식</h1>
        <p id="restSub"></p>
        <ol class="rest-steps" id="restSteps"></ol>
        <div class="rest-mana"><span>마나</span><div class="rbar"><div id="restFill"></div></div><b id="restPct"></b></div>
        <p class="note" id="restNote"></p>
      </header>
      <div id="restMeter"></div>
      <div id="restGuide"></div>
    </div>
    <footer class="gd-foot rest-foot">
      <button class="btn primary" id="restGo" type="button">계속</button>
    </footer>
  </section>

  <section id="battle" class="screen" hidden aria-label="전투">
    <!-- 보스 무대 (27 3-4, 시안 MmoBattle5·20): 원형 초상 · 위치 줄 · 이름 + 구간 진행 · 시간 줄 · 체력 · 예고 칸 3개 -->
    <header id="stage">
      <div class="stage-head">
        <div id="bossArt" aria-hidden="true"></div>
        <img id="bossAdds" alt="" aria-hidden="true" decoding="async" draggable="false" hidden>
        <div class="stage-main">
          <span class="stage-loc"><span id="encounterLabel"></span><span id="phase"></span></span>
          <div class="boss-heading"><span id="bossName"></span><span id="segDots" hidden></span></div>
          <span class="stage-time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3v2c0 3 4 5 4 7s-4 4-4 7v2M16 3v2c0 3-4 5-4 7s4 4 4 7v2"/></svg><span id="timer"></span></span>
        </div>
        <button id="pauseBtn" type="button" aria-label="일시정지"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg></button>
      </div>
      <div class="hpbar"><div id="bossLag"></div><div id="bossFill"></div><div id="bossTicks"></div><div id="bossHpText"></div></div>
      <div id="queue" aria-label="적 기술 예고"></div>
      <div id="dmgNums" aria-hidden="true"></div>
    </header>
    <div id="partyStatus"><span class="ps-count">파티 <b id="partyAlive"></b></span><span id="partyCondition"></span><span class="board-instruction">탭 · 쓸기로 치유</span></div>
    <div id="boardWrap">
      <canvas id="board" aria-label="파티 체력과 진형. 칸을 탭해 치유하고 길게 눌러 파티원 정보 확인"></canvas>
      <div id="toast"></div>
      <div id="banner"></div>
      <div id="preview" hidden></div>
      <div id="pull" hidden><b id="pullNum">3</b></div>
    </div>
    <!-- 시전 막대 (시안): 화면 폭 금테 막대, 노란 유광 채움, 안에 「스킬 → 대상」 · 남은 초. 시전 중이 아닐 때 안내도 막대 안에 -->
    <div id="castbar"><div id="castTrack"><div id="castFill"></div><span id="castLabel">칸을 탭하면 치유</span><span id="castTime"></span></div></div>
    <footer id="controls">
      <div id="wheel" aria-label="치유 스킬 휠"></div>
      <div id="side">
        <div id="aux" aria-label="특성 보조 버튼" hidden></div>
        <div id="items" aria-label="소비 아이템 단축칸"></div>
        <div id="gauges"></div>
        <div id="hint">길게 누르면 설명</div>
        <button id="giveUp" class="btn" type="button" hidden>포기</button>
      </div>
    </footer>
    <div id="tip" role="status" hidden></div>
    <div id="pause" class="overlay" hidden>
      <div class="card">
        <div class="phead"><h3>일시정지</h3><span id="pauseSub"></span></div>
        <div class="gd-scroll" id="pauseGuide"></div>
        <label class="toggle pdev"><input type="checkbox" id="pauseAuto"> 자동 치유 (개발 빌드)</label>
        <div class="pbtns">
          <button class="btn primary" id="resumeBtn" type="button">계속</button>
          <button class="btn" id="restartBtn" type="button">처음부터 다시</button>
          <button class="btn" id="quitBtn" type="button">포기하고 나가기</button>
        </div>
      </div>
    </div>
  </section>

</div>
<nav id="tabs" aria-label="하단 메뉴"></nav>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
