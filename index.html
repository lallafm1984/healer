<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12131F">
<title>나혼자 힐러 (개발 빌드)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
</head>
<body>
<!-- 전체화면: 화면 맨 위부터 노치 포함 70dp = 배너 영역 (09 5장, Lim 2026-10-07) -->
<div id="adBanner" aria-label="배너 광고 자리"><span>배너 광고 자리 · 70dp</span></div>
<div id="viewport">
<div id="app">
  <!-- 새 화면(타이틀·로비·콘텐츠·입장·편성·정산·보상·설정)은 src/screens가 여기에 붙인다 -->
  <section id="rest" class="screen" hidden aria-label="휴식">
    <div class="gd-scroll" id="restBody">
      <header class="rest-head">
        <h1>휴식</h1>
        <p id="restSub"></p>
        <ol class="rest-steps" id="restSteps"></ol>
        <div class="rest-mana"><span>마나</span><div class="rbar"><div id="restFill"></div></div><b id="restPct"></b></div>
        <p class="note" id="restNote"></p>
      </header>
      <div id="restGuide"></div>
    </div>
    <footer class="gd-foot rest-foot">
      <button class="btn primary" id="restGo" type="button">계속</button>
    </footer>
  </section>

  <section id="battle" class="screen" hidden>
    <header id="stage">
      <div id="bossArt"></div>
      <div class="stage-main">
        <div class="stage-top">
          <span id="bossName"></span>
          <button id="pauseBtn" type="button" aria-label="일시정지">❚❚</button>
        </div>
        <div class="stage-meta">
          <span id="phase"></span>
          <span id="timer"></span>
        </div>
        <div class="hpbar"><div id="bossFill"></div><div id="bossHpText"></div></div>
      </div>
      <div id="queue"></div>
      <div id="dpsPop"></div>
    </header>
    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="toast"></div>
      <div id="banner"></div>
      <div id="preview" hidden></div>
      <div id="pull" hidden><b id="pullNum">3</b></div>
    </div>
    <div id="castbar"><span id="castLabel">칸을 탭하면 치유</span><div id="castTrack"><div id="castFill"></div></div></div>
    <footer id="controls">
      <div id="wheel"></div>
      <div id="side">
        <div id="items" aria-label="소비 아이템 단축칸"></div>
        <div id="gauges"><span>평온 <b id="gP">0</b>%</span><span>신성화 <b id="gS">0</b>%</span></div>
        <div id="hint">아이템: 누르면 사용<br>길게 누르면 설명</div>
      </div>
    </footer>
    <div id="tip" role="status" hidden></div>
    <div id="pause" class="overlay" hidden>
      <div class="card">
        <div class="phead"><h3>일시정지</h3><span id="pauseSub"></span></div>
        <div class="gd-scroll" id="pauseGuide"></div>
        <div class="pbtns">
          <button class="btn primary" id="resumeBtn" type="button">계속</button>
          <button class="btn" id="restartBtn" type="button">처음부터 다시</button>
          <button class="btn" id="quitBtn" type="button">포기하고 나가기</button>
        </div>
      </div>
    </div>
  </section>

</div>
<nav id="tabs" aria-label="하단 메뉴"></nav>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
